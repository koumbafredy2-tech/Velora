  <style>
    /* Confort mobile, transitions fluides & suppression des barres de défilement */
    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #FAF8F5;
      color: #1A1519;
      font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Transitions rapides et fluides pour l'aperçu de thème en direct */
    .theme-smooth {
      transition: background 0.25s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .anim-slide-up { animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade-in { animation: fadeIn 0.2s ease forwards; }
    .anim-pop { animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Fond carte minimaliste pour l'aperçu localisation */
    .velora-map-bg {
      background-color: #F4EDE4;
      background-image:
        linear-gradient(to right, rgba(198, 161, 91, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(198, 161, 91, 0.18) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    /* Sélecteur de couleur HTML5 propre */
    input[type="color"].velora-color-input {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    input[type="color"].velora-color-input::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"].velora-color-input::-webkit-color-swatch { border: none; border-radius: 9999px; }
  </style>

  <!-- ==================== JAVASCRIPT APPLICATIF ==================== -->
  <script>
    // =========================================================================
    // 0. CONFIGURATION VELORA & SUPABASE (FETCH NATIF, NON BLOQUANT)
    // =========================================================================
    const FREE_ARTICLE_LIMIT = 5;
    const DEMO_SLOT_MAX = 7;
    const SUPABASE_URL = 'https://rlzojwhpcybkqlgjisec.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_aSWf3b7yEWyCKKLyZEeT3w_k6R7mnAc';
    const BUCKET_PHOTOS = 'photos-articles';
    const BUCKET_CERT = 'justificatifs-certification';

    function sbHeaders(extra) {
      return Object.assign({
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      }, extra || {});
    }

    /**
     * Envoie une image compressée (dataURL) vers le bucket public `photos-articles`.
     * Retourne l'URL publique ou null en cas d'erreur / hors-ligne.
     */
    async function uploadImageToSupabase(dataUrl, shopId) {
      try {
        if (!dataUrl || !dataUrl.startsWith('data:image/')) return null;
        const resBlob = await fetch(dataUrl);
        const blob = await resBlob.blob();
        const fileName = `${shopId}/${Date.now()}.jpg`;
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_PHOTOS}/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': blob.type || 'image/jpeg',
            'x-upsert': 'true'
          },
          body: blob
        });
        if (!uploadRes.ok) return null;
        return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_PHOTOS}/${fileName}`;
      } catch (e) {
        return null;
      }
    }

    /**
     * Synchronise une boutique réelle vers la table Supabase `boutiques`.
     */
   async function sbSyncShop(shop) {
  if (!shop || shop.isDemo) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/shops`, {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({
        id: shop.id,
        name: shop.name,
        city: shop.city,
        district: shop.district,
        whatsapp: shop.whatsapp
      })
    });
  } catch (e) {
    // Silencieux : localStorage reste la source immédiate
  }
}
      

    /**
     * Synchronise un article réel vers la table Supabase `articles`.
     */
    async function sbSyncProduct(prod) {
      if (!prod) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/articles`, {
          method: 'POST',
          headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify({
            id: prod.id,
            boutique_id: prod.shopId,
            titre: prod.title,
            prix: prod.price,
            categorie: prod.category,
            
            photo_url: prod.image || '',
            vendu: !!prod.sold
          })
        });
      } catch (e) {
        // Silencieux
      }
    }

    /**
     * Supprime un article de la table Supabase `articles`.
     */
    async function sbDeleteProduct(productId) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/articles?id=eq.${encodeURIComponent(productId)}`, {
          method: 'DELETE',
          headers: sbHeaders()
        });
      } catch (e) {
        // Silencieux
      }
    }

    /**
     * Charge de manière asynchrone les vraies boutiques et articles depuis Supabase
     * et les fusionne silencieusement (sans jamais bloquer le rendu initial).
     */
    async function sbHydrateFromRemote() {
      try {
        const [shopsRes, prodsRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/boutiques?select=*`, { headers: sbHeaders() }),
          fetch(`${SUPABASE_URL}/rest/v1/articles?select=*`, { headers: sbHeaders() })
        ]);

        let changed = false;

        if (shopsRes && shopsRes.ok) {
          const remoteShops = await shopsRes.json();
          if (Array.isArray(remoteShops) && remoteShops.length > 0) {
            remoteShops.forEach(row => {
              if (!row || !row.id || !row.nom) return;
              const existing = state.shops.find(s => s.id === row.id);
              const matchedReg = REGIONS.find(r =>
                r.country.toLowerCase() === String(row.pays || '').toLowerCase() ||
                r.currency === row.devise
              ) || REGIONS[1];
              const primary = normalizeHex(row.couleur_principale || '#831843');
              const accent = normalizeHex(row.couleur_accent || '#F472B6');
              const mapped = {
                id: String(row.id),
                name: String(row.nom),
                slug: String(row.slug || slugify(row.nom)),
                regionId: matchedReg.id,
                country: String(row.pays || matchedReg.country),
                city: String(row.ville || matchedReg.city),
                district: String(row.quartier || ''),
                privacy: 'area',
                whatsapp: String(row.whatsapp || ''),
                currency: String(row.devise || matchedReg.currency),
                themeId: String(row.theme_id || 'custom'),
                primaryColor: primary,
                primaryEnd: computeGradientEnd(primary),
                accentColor: accent,
                surfaceColor: computeSoftSurface(primary),
                avatar: existing ? existing.avatar : '',
                tagline: `${row.quartier || ''} · ${row.ville || matchedReg.city}`.replace(/^ · /, ''),
                coords: existing ? existing.coords : { lat: matchedReg.lat, lng: matchedReg.lng },
                verified: !!row.certifiee,
                certPreRegistered: !!row.preinscription_certification,
                isOwner: existing ? !!existing.isOwner : false,
                isDemo: false
              };

              if (existing) {
                Object.assign(existing, mapped);
              } else {
                state.shops.unshift(mapped);
              }
              changed = true;
            });
          }
        }

        if (prodsRes && prodsRes.ok) {
          const remoteProds = await prodsRes.json();
          if (Array.isArray(remoteProds) && remoteProds.length > 0) {
            remoteProds.forEach(row => {
              if (!row || !row.id || !row.boutique_id || !row.titre) return;
              const existing = state.products.find(p => p.id === row.id);
              const mappedProd = {
                id: String(row.id),
                shopId: String(row.boutique_id),
                title: String(row.titre),
                price: Number(row.prix || 0),
                category: String(row.categorie || 'fashion'),
                detail: String(row.description || ''),
                image: String(row.photo_url || ''),
                sold: !!row.vendu
              };
              if (existing) {
                Object.assign(existing, mappedProd);
              } else {
                state.products.unshift(mappedProd);
              }
              changed = true;
            });
          }
        }

        if (changed) {
          saveState();
          renderAll();
        }
      } catch (e) {
        // Silencieux si hors-ligne ou tables non encore créées
      }
    }

    // =========================================================================

    // =========================================================================
    // 2. CONTRASTE AUTOMATIQUE WCAG & CALCUL DE THÈMES
    // =========================================================================
    function normalizeHex(hex) {
      let c = String(hex || '#831843').trim();
      if (!c.startsWith('#')) c = '#' + c;
      if (/^#[0-9a-fA-F]{3}$/.test(c)) {
        c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
      }
      return /^#[0-9a-fA-F]{6}$/.test(c) ? c.toUpperCase() : '#831843';
    }

    function hexToRgb(hex) {
      const clean = normalizeHex(hex).slice(1);
      return {
        r: parseInt(clean.slice(0, 2), 16),
        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b) {
      const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
      return '#' + [clamp(r), clamp(g), clamp(b)].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function hexToRgba(hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getContrastColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      const lin = v => {
        const s = v / 255;
        return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
      };
      const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
      const darkLum = 0.007;
      const contrastWhite = 1.05 / (lum + 0.05);
      const contrastDark = (lum + 0.05) / (darkLum + 0.05);
      return contrastDark >= contrastWhite ? '#141115' : '#FFFFFF';
    }

    function computeSoftSurface(hex) {
      const { r, g, b } = hexToRgb(hex);
      const mix = c => Math.round(255 * 0.91 + c * 0.09);
      return rgbToHex(mix(r), mix(g), mix(b));
    }

    function computeGradientEnd(hex) {
      const { r, g, b } = hexToRgb(hex);
      const avg = (r + g + b) / 3;
      if (avg < 55) return rgbToHex(r + 36, g + 34, b + 38);
      return rgbToHex(r * 0.76, g * 0.76, b * 0.76);
    }

    const PRESET_THEMES = [
      { id: 'velvetRose', name: 'Velvet Rose', primary: '#831843', primaryEnd: '#BE185D', accent: '#F472B6', surface: '#FDF2F8' },
      { id: 'champagneSilk', name: 'Champagne Silk', primary: '#92672A', primaryEnd: '#C69749', accent: '#E8C574', surface: '#FCF8EE' },

      { key: 'duoBlueYellow', primary: '#1D4ED8', accent: '#FACC15' },
      { key: 'duoBlackNeon', primary: '#111827', accent: '#39FF14' },
      { key: 'duoCoralGold', primary: '#F97316', accent: '#FACC15' }
    ];

    function resolveTheme(obj) {
      const preset = obj.themeId ? PRESET_THEMES.find(p => p.id === obj.themeId) : null;
      const primary = normalizeHex(preset ? preset.primary : obj.primaryColor || obj.primary || '#831843');
      const primaryEnd = normalizeHex(preset ? preset.primaryEnd : obj.primaryEnd || computeGradientEnd(primary));
      const accent = normalizeHex(preset ? preset.accent : obj.accentColor || obj.accent || '#F472B6');
      const surface = normalizeHex(preset ? preset.surface : obj.surfaceColor || obj.surface || computeSoftSurface(primary));
      const matchedPreset = preset || PRESET_THEMES.find(p => p.primary === primary && p.accent === accent);

      return {
        id: matchedPreset ? matchedPreset.id : 'custom',
        name: matchedPreset ? matchedPreset.name : t('customThemeName'),
        isPreset: !!matchedPreset,
        primary,
        primaryEnd,
        accent,
        surface,
        gradient: `linear-gradient(135deg, ${primary} 0%, ${primaryEnd} 100%)`,
        primaryText: getContrastColor(primary),
        accentText: getContrastColor(accent),
        surfaceBorder: hexToRgba(primary, 0.16)
      };
    }

    function createInitialState() {
      return {
        lang: 'FR',

        sellerSubView: 'auto',

        directNotes: {}
      };

      name: '',

      city: 'Libreville',
      district: '',

      gpsDetected: false,

      surfaceColor: '#FDF2F8',
      customOpen: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.lang && I18N[saved.lang]) state.lang = saved.lang;
        if (saved.regionId) state.regionId = saved.regionId;
        if (Array.isArray(saved.shops) && saved.shops.length > 0) {
          // Garantir que le drapeau isDemo est correctement défini même pour les sauvegardes précédentes
          state.shops = saved.shops.map(s => ({
            ...s,
            isDemo: typeof s.isDemo === 'boolean' ? s.isDemo : (!s.isOwner && DEFAULT_DEMO_IDS.has(s.id))
          }));
        }
        if (Array.isArray(saved.products) && saved.products.length > 0) state.products = saved.products;
        if (saved.carts && typeof saved.carts === 'object') {
          // Nettoyer tout éventuel panier provenant d'une boutique de démonstration
          const cleanCarts = {};
          Object.keys(saved.carts).forEach(sid => {
            const shop = state.shops.find(s => s.id === sid);
            if (shop && !shop.isDemo) cleanCarts[sid] = saved.carts[sid];
          });
          state.carts = cleanCarts;
        }
        if (saved.cartNotes && typeof saved.cartNotes === 'object') state.cartNotes = saved.cartNotes;
        if (saved.activeSellerShopId) state.activeSellerShopId = saved.activeSellerShopId;
      } catch (err) {
        // Ignorer si localStorage est restreint
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: state.lang,
          regionId: state.regionId,
          shops: state.shops,
          products: state.products,
          carts: state.carts,
          cartNotes: state.cartNotes,
          activeSellerShopId: state.activeSellerShopId
        }));
      } catch (err) {
        // Ignorer quota dépassé
      }
    }

    // =========================================================================
    // 7. UTILITAIRES GÉNÉRAUX & LOGIQUE PROGRESSIVE DES EXEMPLES
    // =========================================================================
    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N.FR[key] || key;
    }

    function esc(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Retourne les boutiques actives avec priorité absolue aux vraies boutiques
     * et disparition progressive des boutiques de démonstration (1 exemple en moins
     * par vraie boutique créée, jusqu'à 0 exemple dès 7+ vraies boutiques).
     */
    function getActiveShops() {
      const realShops = state.shops.filter(s => !s.isDemo);
      const demoShops = state.shops.filter(s => s.isDemo);
      const maxDemoToShow = Math.max(0, DEMO_SLOT_MAX - realShops.length);
      return [...realShops, ...demoShops.slice(0, maxDemoToShow)];
    }

    function formatPrice(amount, currency) {
      const n = Number(amount || 0);
      if (currency === 'EUR') return `${n.toLocaleString('fr-FR')} €`;
      if (currency === 'USD') return `$${n.toLocaleString('en-US')}`;
      if (currency === 'JPY') return `¥${n.toLocaleString('ja-JP')}`;
      if (currency === 'XOF') return `${n.toLocaleString('fr-FR')} F CFA`;
      return `${n.toLocaleString('fr-FR')} FCFA`;
    }

    function slugify(str) {
      return String(str || 'ma-boutique')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'ma-boutique';
    }

    function initials(name) {
      const parts = String(name || 'V').trim().split(/\s+/);
      return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : String(name || 'V').slice(0, 2).toUpperCase();
    }

    function cleanWa(phone) {
      return String(phone || '').replace(/[^\d]/g, '');
    }

    function catLabel(catId) {
      const found = CATEGORIES.find(c => c.id === catId);
      return found ? t(found.key) : catId;
    }

    function regionLabel(regionId) {
      if (regionId === 'ALL') return t('worldwide');
      const r = REGIONS.find(x => x.id === regionId);
      return r ? `${r.country} · ${r.city}` : t('worldwide');
    }

    function regionShortLabel(regionId) {
      if (regionId === 'ALL') return t('worldwide');
      const r = REGIONS.find(x => x.id === regionId);
      return r ? r.city : t('worldwide');
    }

    function copyText(text, toastMessage) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, 99999);
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(toastMessage || t('copiedLink'));
      } catch (e) {
        showToast(text);
      }
    }

    function showToast(msg) {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const el = document.createElement('div');
      el.className = 'pointer-events-auto flex items-center justify-center gap-2 px-4 py-2.5 rounded-full bg-ink text-ivory text-xs font-medium shadow-float anim-slide-up';
      el.innerHTML = `<span class="text-champagne">${SVG.check}</span><span>${esc(msg)}</span>`;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 230);
      }, 2200);
    }

    // =========================================================================
    // 8. MOTEUR PANIER INDÉPENDANT PAR BOUTIQUE & BOUTONS RÉTRACTABLES (- / +)
    // =========================================================================
    function getShopCart(shopId) {
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop || shop.isDemo) return [];
      const entries = state.carts[shopId] || [];
      return entries.filter(e => {
        const p = state.products.find(x => x.id === e.productId);
        return p && !p.sold && e.qty > 0;
      });
    }

    function getShopCartCount(shopId) {
      return getShopCart(shopId).reduce((sum, e) => sum + e.qty, 0);
    }

    function getShopCartTotal(shopId) {
      return getShopCart(shopId).reduce((sum, e) => {
        const p = state.products.find(x => x.id === e.productId);
        return sum + (p ? p.price * e.qty : 0);
      }, 0);
    }

    function getTotalCartCountAll() {
      return Object.keys(state.carts).reduce((sum, sid) => sum + getShopCartCount(sid), 0);
    }

    function getQtyInCart(shopId, productId) {
      const entry = getShopCart(shopId).find(e => e.productId === productId);
      return entry ? entry.qty : 0;
    }

    function changeCartQty(shopId, productId, delta, event, refreshProductModalId = null) {
      if (event) event.stopPropagation();
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop || shop.isDemo) {
        showToast(t('demoToastBlocked'));
        return;
      }
      const prod = state.products.find(p => p.id === productId);
      if (!prod || (prod.sold && delta > 0)) return;

      if (!state.carts[shopId]) state.carts[shopId] = [];
      const existing = state.carts[shopId].find(e => e.productId === productId);

      if (existing) {
        existing.qty += delta;
        if (existing.qty <= 0) {
          state.carts[shopId] = state.carts[shopId].filter(e => e.productId !== productId);
          showToast(t('removedToast'));
        } else if (delta > 0) {
          showToast(t('addedToast'));
        }
      } else if (delta > 0) {
        state.carts[shopId].push({ productId, qty: delta });
        showToast(t('addedToast'));
      }

      if (state.carts[shopId] && state.carts[shopId].length === 0) {
        delete state.carts[shopId];
      }

      saveState();
      renderAll();

      if (!document.getElementById('cartDrawer').classList.contains('hidden')) {
        if (getShopCartCount(shopId) > 0) renderCartDrawer(shopId);
        else closeModal('cartDrawer');
      }
      if (refreshProductModalId && !document.getElementById('productModal').classList.contains('hidden')) {
        openProductModal(refreshProductModalId);
      }
    }

    function removeCartLine(shopId, productId, event) {
      if (event) event.stopPropagation();
      if (!state.carts[shopId]) return;
      state.carts[shopId] = state.carts[shopId].filter(e => e.productId !== productId);
      if (state.carts[shopId].length === 0) delete state.carts[shopId];
      saveState();
      showToast(t('removedToast'));
      renderAll();

      if (!document.getElementById('cartDrawer').classList.contains('hidden')) {
        if (getShopCartCount(shopId) > 0) renderCartDrawer(shopId);
        else closeModal('cartDrawer');
      }
    }

    function askClearShopCart(shopId) {
      const shop = state.shops.find(s => s.id === shopId);
      document.getElementById('confirmModalBody').innerHTML = `
        <div class="text-center space-y-4">

    function confirmClearShopCart(shopId) {
      delete state.carts[shopId];
      delete state.cartNotes[shopId];
      saveState();
      closeModal('confirmModal');
      closeModal('cartDrawer');
      showToast(t('clearedCartToast'));
      renderAll();
    }

    function buildCartWhatsAppText(shopId) {
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop || shop.isDemo) return '';
      const entries = getShopCart(shopId);
      const total = getShopCartTotal(shopId);
      const note = (state.cartNotes[shopId] || '').trim();

      const lines = [
        `${t('waGreeting')} ${shop.name},`,
        t('waCartIntro'),
        ''
      ];
      entries.forEach(e => {
        const p = state.products.find(x => x.id === e.productId);
        if (p) lines.push(`• ${e.qty}× ${p.title} — ${formatPrice(p.price * e.qty, shop.currency)}`);
      });
      lines.push('');
      lines.push(`${t('waTotal')} : ${formatPrice(total, shop.currency)}`);
      if (note) lines.push(`${t('waNote')} : ${note}`);
      lines.push(t('waClosing'));
      return lines.join('\n');
    }

    function buildDirectBuyWhatsAppText(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return '';
      const shop = state.shops.find(s => s.id === prod.shopId);
      if (!shop || shop.isDemo) return '';
      const note = (state.directNotes[productId] || '').trim();

      const lines = [
        `${t('waGreeting')} ${shop.name},`,
        t('waDirectIntro'),
        '',
        `• 1× ${prod.title} — ${formatPrice(prod.price, shop.currency)}`,
        ''
      ];
      if (note) lines.push(`${t('waNote')} : ${note}`);
      lines.push(t('waClosing'));
      return lines.join('\n');
    }

    function applyLiveThemeDom(mode, themeObj) {
      const th = resolveTheme(themeObj);

      PRESET_THEMES.forEach(preset => {
        const card = document.querySelector(`[data-preset-card="${mode}_${preset.id}"]`);
        const chk = document.querySelector(`[data-preset-check="${mode}_${preset.id}"]`);
        const active = th.id === preset.id;
        if (card) {
          card.style.borderColor = active ? preset.primary : '';
          card.style.backgroundColor = active ? preset.surface : '';
          card.classList.toggle('shadow-sm', active);
          card.classList.toggle('border-hairline', !active);
          card.classList.toggle('bg-surface', !active);
        }
        if (chk) {
          chk.classList.toggle('flex', active);
          chk.classList.toggle('hidden', !active);
        }
      });

      const pPicker = document.getElementById(`pickerPrimary_${mode}`);
      const aPicker = document.getElementById(`pickerAccent_${mode}`);
      const pHex = document.getElementById(`hexPrimary_${mode}`);
      const aHex = document.getElementById(`hexAccent_${mode}`);
      if (pPicker && pPicker.value.toUpperCase() !== th.primary) pPicker.value = th.primary;
      if (aPicker && aPicker.value.toUpperCase() !== th.accent) aPicker.value = th.accent;
      if (pHex) pHex.textContent = th.primary;
      if (aHex) aHex.textContent = th.accent;

      VIBRANT_SWATCHES.forEach(sw => {
        const pb = document.querySelector(`[data-swatch="${mode}_primary_${sw.hex}"]`);
        if (pb) {
          const active = th.primary === sw.hex;
          pb.classList.toggle('border-ink', active);
          pb.classList.toggle('scale-110', active);
          pb.classList.toggle('border-white', !active);
          if (pb.firstElementChild) pb.firstElementChild.classList.toggle('hidden', !active);
        }
        const ab = document.querySelector(`[data-swatch="${mode}_accent_${sw.hex}"]`);
        if (ab) {
          const active = th.accent === sw.hex;
          ab.classList.toggle('border-ink', active);
          ab.classList.toggle('scale-110', active);
          ab.classList.toggle('border-white', !active);
          if (ab.firstElementChild) ab.firstElementChild.classList.toggle('hidden', !active);
        }
      });

      const badge = document.getElementById(`previewThemeBadge_${mode}`);
      const shell = document.getElementById(`previewShell_${mode}`);
      const banner = document.getElementById(`previewBanner_${mode}`);
      const avatar = document.getElementById(`previewAvatar_${mode}`);
      const locPill = document.getElementById(`previewLocPill_${mode}`);
      const priceBadge = document.getElementById(`previewPriceBadge_${mode}`);
      const buyBtn = document.getElementById(`previewBuyBtn_${mode}`);
      const cartBtn = document.getElementById(`previewCartBtn_${mode}`);

      if (badge) {
        badge.textContent = `${t('livePreviewBadgePrefix')} · ${th.name}`;
        badge.style.backgroundColor = th.accent;
        badge.style.color = th.accentText;
      }
      if (shell) {
        shell.style.backgroundColor = th.surface;
        shell.style.borderColor = th.surfaceBorder;
      }
      if (banner) {
        banner.style.background = th.gradient;
        banner.style.color = th.primaryText;
      }
      if (avatar) {
        avatar.style.borderColor = th.accent;
        avatar.style.backgroundColor = th.accent;
        avatar.style.color = th.accentText;
      }
      if (locPill) {
        locPill.style.backgroundColor = hexToRgba(th.primaryText, 0.16);
        locPill.style.borderColor = hexToRgba(th.primaryText, 0.28);
      }
      if (priceBadge) {
        priceBadge.style.backgroundColor = th.accent;
        priceBadge.style.color = th.accentText;
      }
      if (buyBtn) {
        buyBtn.style.background = th.gradient;
        buyBtn.style.color = th.primaryText;
      }
      if (cartBtn) {
        cartBtn.style.backgroundColor = th.accent;
        cartBtn.style.color = th.accentText;
      }

      if (mode === 'dashboard') {
        const dashHero = document.getElementById('dashShopHero');
        const dashAvatar = document.getElementById('dashShopAvatar');
        const dashClientBtn = document.getElementById('dashClientViewBtn');
        const dashPublishBtn = document.getElementById('dashPublishBtn');
        if (dashHero) {
          dashHero.style.background = th.gradient;
          dashHero.style.color = th.primaryText;
        }
        if (dashAvatar) {
          dashAvatar.style.borderColor = th.accent;
          dashAvatar.style.backgroundColor = th.accent;
          dashAvatar.style.color = th.accentText;
        }
        if (dashClientBtn) {
          dashClientBtn.style.backgroundColor = th.accent;
          dashClientBtn.style.color = th.accentText;
        }
        if (dashPublishBtn) {
          dashPublishBtn.style.background = th.gradient;
          dashPublishBtn.style.color = th.primaryText;
        }
      }
    }

    function selectPresetTheme(mode, presetId) {
      const preset = PRESET_THEMES.find(p => p.id === presetId);
      if (!preset) return;

      if (mode === 'create') {
        formDraft.themeId = preset.id;
        formDraft.primaryColor = preset.primary;
        formDraft.primaryEnd = preset.primaryEnd;
        formDraft.accentColor = preset.accent;
        formDraft.surfaceColor = preset.surface;
        applyLiveThemeDom('create', formDraft);
      } else if (mode === 'dashboard') {
        const shop = state.shops.find(s => s.id === state.activeSellerShopId);
        if (!shop) return;
        shop.themeId = preset.id;
        shop.primaryColor = preset.primary;
        shop.primaryEnd = preset.primaryEnd;
        shop.accentColor = preset.accent;
        shop.surfaceColor = preset.surface;
        saveState();
        sbSyncShop(shop);
        applyLiveThemeDom('dashboard', shop);
        showToast(`${t('themeAppliedToast')} : ${preset.name}`);
      }
    }

    function toggleCustomColorStudio(mode) {
      const panel = document.getElementById(`customStudio_${mode}`);
      const btn = document.getElementById(`toggleCustomBtn_${mode}`);
      if (mode === 'create') {
        formDraft.customOpen = !formDraft.customOpen;
        if (panel) panel.classList.toggle('hidden', !formDraft.customOpen);
        if (btn) btn.querySelector('span').innerHTML = formDraft.customOpen ? SVG.minus : SVG.plus;
      } else {
        dashStudio.customOpen = !dashStudio.customOpen;
        if (panel) panel.classList.toggle('hidden', !dashStudio.customOpen);
        if (btn) btn.querySelector('span').innerHTML = dashStudio.customOpen ? SVG.minus : SVG.plus;
      }
    }

    function applyCustomColors(mode, newPrimary, newAccent) {
      if (mode === 'create') {
        const p = newPrimary ? normalizeHex(newPrimary) : formDraft.primaryColor;
        const a = newAccent ? normalizeHex(newAccent) : formDraft.accentColor;
        formDraft.themeId = 'custom';
        formDraft.primaryColor = p;
        formDraft.primaryEnd = computeGradientEnd(p);
        formDraft.accentColor = a;
        formDraft.surfaceColor = computeSoftSurface(p);
        applyLiveThemeDom('create', formDraft);
      } else if (mode === 'dashboard') {
        const shop = state.shops.find(s => s.id === state.activeSellerShopId);
        if (!shop) return;
        const p = newPrimary ? normalizeHex(newPrimary) : shop.primaryColor;
        const a = newAccent ? normalizeHex(newAccent) : shop.accentColor;
        shop.themeId = 'custom';
        shop.primaryColor = p;
        shop.primaryEnd = computeGradientEnd(p);
        shop.accentColor = a;
        shop.surfaceColor = computeSoftSurface(p);
        saveState();
        sbSyncShop(shop);
        applyLiveThemeDom('dashboard', shop);
      }
    }

    // =========================================================================
    // 10. FILTRAGE PAR RÉGION, RECHERCHE & CATÉGORIE (PRIORITÉ AUX VRAIES)
    // =========================================================================
    function getRegionShops() {
      const active = getActiveShops();
      if (state.regionId === 'ALL') return active;
      return active.filter(s => s.regionId === state.regionId);
    }

    function getFilteredProducts() {
      const regionShops = getRegionShops();
      const shopMap = new Map(regionShops.map(s => [s.id, s]));
      const q = state.search.trim().toLowerCase();

      const filtered = state.products.filter(p => {
        const shop = shopMap.get(p.shopId);
        if (!shop) return false;
        if (state.category !== 'all' && p.category !== state.category) return false;
        if (!q) return true;
        return (
          p.title.toLowerCase().includes(q) ||
          (p.detail || '').toLowerCase().includes(q) ||
          shop.name.toLowerCase().includes(q) ||
          shop.city.toLowerCase().includes(q) ||
          shop.district.toLowerCase().includes(q) ||
          shop.country.toLowerCase().includes(q)
        );
      });

      // Toujours afficher les articles des vraies boutiques avant les exemples
      return filtered.sort((a, b) => {
        const sa = shopMap.get(a.shopId);
        const sb = shopMap.get(b.shopId);
        const da = sa && sa.isDemo ? 1 : 0;
        const db = sb && sb.isDemo ? 1 : 0;
        return da - db;
      });
    }

    function renderBottomNav() {
      const totalCarts = getTotalCartCountAll();
      const hasOwnedShop = state.shops.some(s => s.isOwner);
      const tabs = [
        { id: 'explore', label: t('navExplore'), icon: SVG.explore },
        { id: 'boutiques', label: t('navBoutiques'), icon: SVG.store },
        { id: 'carts', label: t('navCarts'), icon: SVG.bag, badge: totalCarts },
        { id: 'sell', label: hasOwnedShop ? t('navMyShop') : t('navSell'), icon: SVG.plusCircle }
      ];

      document.getElementById('bottomNav').innerHTML = tabs.map(tab => {
        const active = state.view === tab.id || (state.view === 'shop' && tab.id === 'boutiques');
        return `
          <button
            type="button"
            onclick="navigate('${tab.id}')"
            class="relative flex flex-col items-center justify-center gap-1 py-1.5 transition-colors ${active ? 'text-plum' : 'text-ink-muted hover:text-ink'}"

            <span class="relative">
              ${tab.icon}
              ${tab.badge > 0 ? `

            </span>
            <span class="text-[10px] font-medium tracking-wide truncate max-w-[78px]">${esc(tab.label)}</span>

    function renderFloatingBar() {
      const bar = document.getElementById('shopFloatingBar');
      if (state.view !== 'shop' || !state.activeShopId) {
        bar.classList.add('hidden');
        return;
      }
      const shop = state.shops.find(s => s.id === state.activeShopId);
      const count = getShopCartCount(state.activeShopId);
      if (!shop || shop.isDemo || count === 0) {
        bar.classList.add('hidden');
        return;
      }

      const subtotal = getShopCartTotal(shop.id);
      const th = resolveTheme(shop);

      bar.classList.remove('hidden');
      bar.innerHTML = `
        <button
          type="button"
          onclick="openCartDrawer('${shop.id}')"
          style="background: ${th.gradient}; color: ${th.primaryText}; border: 1px solid ${hexToRgba(th.primaryText, 0.18)};"

              ${count}

            <div class="text-left leading-tight min-w-0">

      `;

    function renderAll() {
      renderHeader();
      renderBottomNav();
      renderFloatingBar();

      const main = document.getElementById('appMain');
      if (state.view === 'explore') main.innerHTML = renderExploreView();
      else if (state.view === 'boutiques') main.innerHTML = renderBoutiquesView();
      else if (state.view === 'shop') main.innerHTML = renderShopView();
      else if (state.view === 'carts') main.innerHTML = renderCartsView();
      else if (state.view === 'sell') main.innerHTML = renderSellView();

    function renderProductCard(prod, showShopName, useBoutiqueTheme = false) {
      const shop = state.shops.find(s => s.id === prod.shopId);
      if (!shop) return '';
      const isDemo = !!shop.isDemo;
      const qty = isDemo ? 0 : getQtyInCart(shop.id, prod.id);
      const th = resolveTheme(shop);

      const pillBg = useBoutiqueTheme ? th.accent : '#3B1730';
      const pillText = useBoutiqueTheme ? th.accentText : '#FFFFFF';
      const priceColor = useBoutiqueTheme ? th.primary : '#3B1730';

      return `
        <article class="group flex flex-col bg-surface rounded-2xl border border-hairline overflow-hidden shadow-[0_2px_10px_-4px_rgba(26,21,25,0.06)] hover:shadow-editorial transition-shadow">
          <div onclick="openProductModal('${prod.id}')" class="relative cursor-pointer overflow-hidden">
            ${editorialImg(prod.image, prod.title, 'aspect-[3/4]', catLabel(prod.category), 'group-hover:scale-[1.04]')}

              <span class="absolute top-2.5 left-2.5 z-20 px-2.5 py-0.5 rounded-full bg-surface/92 backdrop-blur-sm border border-champagne-border text-[9px] font-bold uppercase tracking-widest text-champagne-dark shadow-xs">

                </span>
              </div>
            ` : isDemo ? '' : qty === 0 ? `
              <button
                type="button"
                onclick="changeCartQty('${shop.id}', '${prod.id}', 1, event)"
                aria-label="${esc(t('addToCart'))}"
                style="${useBoutiqueTheme ? `background-color: ${th.accent}; color: ${th.accentText};` : ''}"

              <div
                onclick="event.stopPropagation()"

                        <div class="w-10 h-10 rounded-full overflow-hidden border-2 shrink-0" style="border-color: ${th.accent};">

                            ? `<img src="${esc(shop.avatar)}" alt="${esc(shop.name)}" onerror="this.style.display='none'" class="w-full h-full object-cover" />`
                            : `<div style="background: ${th.gradient}; color: ${th.primaryText};" class="w-full h-full flex items-center justify-center font-serif font-semibold">${esc(initials(shop.name))}</div>`

    // =========================================================================
    // 22. ACTIONS VENDEUSE (SAISIE LIVE, GPS, CRÉATION, ARTICLES, CERTIFICATION)
    // =========================================================================
    function onCreateShopNameInput(val) {
      formDraft.name = val;
      const clean = val.trim() || 'Ma Boutique';
      const slugEl = document.getElementById('liveShopSlug');
      if (slugEl) slugEl.textContent = 'velora.shop/b/' + slugify(val);

      const pName = document.getElementById('previewShopName_create');
      const pAv = document.getElementById('previewAvatar_create');
      if (pName) pName.textContent = clean;
      if (pAv) pAv.textContent = initials(clean);
    }

    function onCreateRegionChange(regionId) {
      formDraft.regionId = regionId;
      const r = REGIONS.find(x => x.id === regionId) || REGIONS[1];
      formDraft.city = r.city;
      const cityEl = document.getElementById('fShopCity');
      if (cityEl) cityEl.value = r.city;
      onCreateLocationInput();

      const priceEl = document.getElementById('previewPriceBadge_create');
      if (priceEl) {
        priceEl.textContent = formatPrice(r.currency === 'EUR' ? 89 : r.currency === 'USD' ? 95 : r.currency === 'JPY' ? 12500 : 45000, r.currency);
      }
    }

    function onCreateLocationInput() {
      const city = document.getElementById('fShopCity')?.value || '';
      const dist = document.getElementById('fShopDistrict')?.value || '';
      formDraft.city = city;
      formDraft.district = dist;
      const label = [dist.trim(), city.trim()].filter(Boolean).join(' · ') || 'Libreville';
      const locEl = document.getElementById('previewLocText_create');
      if (locEl) locEl.textContent = label;
    }

    function detectSellerGps() {
      const lbl = document.getElementById('gpsBtnLabel');
      if (lbl) lbl.textContent = t('detectingGps');
      const r = REGIONS.find(x => x.id === formDraft.regionId) || REGIONS[1];

      const finish = (lat, lng) => {
        formDraft.coords = { lat, lng };
        formDraft.gpsDetected = true;
        if (lbl) lbl.textContent = t('gpsSaved');
        const distEl = document.getElementById('fShopDistrict');
        if (distEl && !distEl.value.trim()) {
          distEl.value = r.id === 'GA' ? 'Akanda' : r.city;
          onCreateLocationInput();
        }
        showToast(t('gpsSaved'));
      };

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => finish(pos.coords.latitude, pos.coords.longitude),
          () => setTimeout(() => finish(r.lat, r.lng), 380),
          { timeout: 4000 }
        );
      } else {
        setTimeout(() => finish(r.lat, r.lng), 380);
      }
    }

    function submitCreateShop(event) {
      event.preventDefault();
      const name = formDraft.name.trim();
      const r = REGIONS.find(x => x.id === formDraft.regionId) || REGIONS[1];
      const city = formDraft.city.trim() || r.city;
      const district = formDraft.district.trim();
      const whatsapp = formDraft.whatsapp.trim();
      if (!name || !district) return;

      let slug = slugify(name);
      let n = 2;
      while (state.shops.some(s => s.slug === slug)) slug = `${slugify(name)}-${n++}`;

      const resolved = resolveTheme(formDraft);
      const newShop = {
        id: 'shop-' + Date.now(),
        name,
        slug,
        regionId: r.id,
        country: r.country,
        city,
        district,
        privacy: formDraft.privacy,
        whatsapp,
        currency: r.currency,
        themeId: resolved.id,
        primaryColor: resolved.primary,
        primaryEnd: resolved.primaryEnd,
        accentColor: resolved.accent,
        surfaceColor: resolved.surface,
        avatar: '',
        tagline: `${district} · ${city}`,
        coords: formDraft.coords || { lat: r.lat, lng: r.lng },
        verified: false,
        certPreRegistered: !!formDraft.certPreRegistered,
        isOwner: true,
        isDemo: false
      };


      state.shops.unshift(newShop);
      state.activeSellerShopId = newShop.id;
      state.sellerSubView = 'dashboard';
      dashStudio.customOpen = false;

      formDraft = {
        name: '',
        whatsapp: '',
        regionId: 'GA',
        city: 'Libreville',
        district: '',
        privacy: 'area',
        coords: null,
        gpsDetected: false,
        certPreRegistered: false,
        themeId: 'velvetRose',
        primaryColor: '#831843',
        primaryEnd: '#BE185D',
        accentColor: '#F472B6',
        surfaceColor: '#FDF2F8',
        customOpen: false
      };

      saveState();
      sbSyncShop(newShop);
      showToast(newShop.certPreRegistered ? t('certSavedToast') : t('shopCreatedToast'));
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleShopCertification(shopId) {
      const shop = state.shops.find(s => s.id === shopId);
      if (!shop) return;
      shop.certPreRegistered = !shop.certPreRegistered;
      saveState();
      sbSyncShop(shop);
      showToast(shop.certPreRegistered ? t('certSavedToast') : t('certCancelledToast'));
      renderAll();
    }

    function startNewShopForm() {
      formDraft.customOpen = false;
      state.sellerSubView = 'create';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setSellerSubView(mode) {
      state.sellerSubView = mode;
      renderAll();
    }

    function selectSellerShop(shopId) {
      state.activeSellerShopId = shopId;
      dashStudio.customOpen = false;
      saveState();
      renderAll();
    }

    function openSellerDashboard(shopId) {
      state.activeSellerShopId = shopId;
      state.sellerSubView = 'dashboard';
      dashStudio.customOpen = false;
      navigate('sell');
    }

    function pickDemoPreset(idx) {
      const p = DEMO_PRESETS[idx];
      if (!p) return;
      publishPhotoUrl = p.url;
      const img = document.getElementById('publishPreviewImg');
      if (img) img.src = p.url;
      document.querySelectorAll('[data-preset-idx]').forEach(btn => {
        const active = Number(btn.getAttribute('data-preset-idx')) === idx;
        btn.classList.toggle('border-plum', active);
        btn.classList.toggle('border-transparent', !active);
      });
    }

    function handlePhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          try {
            const maxDim = 560;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            publishPhotoUrl = canvas.toDataURL('image/jpeg', 0.78);
          } catch (err) {
            publishPhotoUrl = e.target.result;
          }
          const prev = document.getElementById('publishPreviewImg');
          if (prev) prev.src = publishPhotoUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitPublishItem(event, shopId) {
      event.preventDefault();
      const shop = state.shops.find(s => s.id === shopId);
      const currentCount = state.products.filter(p => p.shopId === shopId).length;
      if (shop && !shop.verified && currentCount >= FREE_ARTICLE_LIMIT) {
        closeModal('publishModal');
        openLimitReachedModal(shopId);
        return;
      }

      const title = document.getElementById('fItemTitle').value.trim();
      const price = parseInt(document.getElementById('fItemPrice').value, 10);
      const category = document.getElementById('fItemCat').value;
      const detail = document.getElementById('fItemDetail').value.trim();
      if (!title || isNaN(price)) return;

      const initialImage = publishPhotoUrl;
      const newProd = {
        id: 'p-' + Date.now(),
        shopId,
        title,
        price,
        category,
        detail,
        image: initialImage,
        sold: false
      };

      state.products.unshift(newProd);
      saveState();
      closeModal('publishModal');
      showToast(t('publishedToast'));
      renderAll();

      // Envoi asynchrone vers Supabase Storage (photos-articles) + table articles
      (async () => {
        const publicUrl = await uploadImageToSupabase(initialImage, shopId);
        if (publicUrl) {
          newProd.image = publicUrl;
          saveState();
        }
        await sbSyncProduct(newProd);
      })();
    }

    function toggleSold(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      prod.sold = !prod.sold;
      saveState();
      sbSyncProduct(prod);
      renderAll();
    }

    function askDeleteItem(productId) {
      document.getElementById('confirmModalBody').innerHTML = `
        <div class="text-center space-y-4">
          <h3 class="font-serif text-xl font-semibold text-ink">${esc(t('deleteConfirm'))}</h3>

              ${esc(t('cancel'))}
            </button>
            <button type="button" onclick="confirmDeleteItem('${productId}')" class="flex-1 py-2.5 rounded-full bg-plum text-ivory text-xs font-semibold">
              ${esc(t('delete'))}
            </button>
          </div>
        </div>
      `;
      openModal('confirmModal');
    }

    function confirmDeleteItem(productId) {
      state.products = state.products.filter(p => p.id !== productId);
      saveState();
      sbDeleteProduct(productId);
      closeModal('confirmModal');
      renderAll();
    }

    function askResetDemo() {
      document.getElementById('confirmModalBody').innerHTML = `
        <div class="text-center space-y-4">
          <h3 class="font-serif text-xl font-semibold text-ink">${esc(t('resetConfirm'))}</h3>
          <div class="flex items-center gap-2">
            <button type="button" onclick="closeModal('confirmModal')" class="flex-1 py-2.5 rounded-full bg-ivory border border-hairline text-xs font-semibold text-ink">
              ${esc(t('cancel'))}
            </button>
            <button type="button" onclick="confirmResetDemo()" class="flex-1 py-2.5 rounded-full bg-plum text-ivory text-xs font-semibold">
              OK
            </button>
          </div>
        </div>
      `;
      openModal('confirmModal');
    }

    function confirmResetDemo() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      const keepLang = state.lang;
      state = createInitialState();
      state.lang = keepLang;
      closeModal('confirmModal');
      showToast(t('resetDone'));
      renderAll();
    }

    // =========================================================================
    // 23. NAVIGATION, RECHERCHE & CYCLE DE VIE DES MODALES
    // =========================================================================
    function navigate(viewName) {
      state.view = viewName;
      if (viewName !== 'shop') state.activeShopId = null;
      if (viewName === 'sell' && state.shops.some(s => s.isOwner) && state.sellerSubView === 'auto') {
        state.sellerSubView = 'dashboard';
      }
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openBoutique(shopId) {
      state.view = 'shop';
      state.activeShopId = shopId;
      state.shopCategory = 'all';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setRegion(regionId) {
      state.regionId = regionId;
      saveState();
      closeModal('regionSheet');
      if (state.view === 'shop') state.view = 'explore';
      renderAll();
    }

    function setLanguage(langCode) {
      state.lang = langCode;
      saveState();
      document.getElementById('langDropdown').classList.add('hidden');
      renderAll();
    }

    function toggleLangMenu(event) {
      event.stopPropagation();
      document.getElementById('langDropdown').classList.toggle('hidden');
    }

    function setCategory(catId) {
      state.category = catId;
      renderAll();
    }

    function setShopCategory(catId) {
      state.shopCategory = catId;
      renderAll();
    }

    function onSearchInput(val) {
      state.search = val;
      const gridWrap = document.getElementById('exploreGridWrap');
      if (gridWrap) gridWrap.innerHTML = renderExploreGridInner();
      else renderAll();
    }

    function clearSearch() {
      state.search = '';
      renderAll();
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('hidden');
      const modals = ['regionSheet', 'productModal', 'directBuyModal', 'cartDrawer', 'mapModal', 'publishModal', 'confirmModal'];
      if (modals.every(mid => document.getElementById(mid).classList.contains('hidden'))) {
        document.body.style.overflow = '';
      }
    }

    function closeBackdrop(event, id) {
      if (event.target.id === id) closeModal(id);
    }

    document.addEventListener('click', () => {
      const dd = document.getElementById('langDropdown');
      if (dd) dd.classList.add('hidden');
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        ['confirmModal', 'directBuyModal', 'mapModal', 'productModal', 'cartDrawer', 'publishModal', 'regionSheet'].forEach(closeModal);
      }
    });

    // =========================================================================
    // 24. INITIALISATION GARANTIE (RENDU IMMÉDIAT + SYNCHRO SUPABASE EN FOND)
    // =========================================================================
    function initApp() {
      loadState();
      renderAll();
      sbHydrateFromRemote();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
